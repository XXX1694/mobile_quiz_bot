name: Send Daily Quiz

on:
  schedule:
    # Время в UTC (Алматы = UTC+5). Один запуск постит по 1 квизу на стек
    # (iOS / Android / Mobile) = 3 квиза в день. Показанные уходят в used_questions.json.
    # 10:13 Алматы (05:13 UTC)
    - cron: '13 5 * * *'
  workflow_dispatch: # Кнопка для ручного запуска

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: quiz-state
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install aiogram

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py

      - name: Commit updated state
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add used_questions.json
          if git diff --cached --quiet; then
            echo "No state change to commit."
          else
            git commit -m "chore: update quiz state"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME:-main}
            git push origin HEAD:${GITHUB_REF_NAME:-main}
          fi
