name: Send Daily Quiz

on:
  schedule:
    # Время в UTC (Алматы = UTC+5). 5 постов в день, темы выбирает сам бот.
    # 09:13 Алматы (04:13 UTC)
    - cron: '13 4 * * *'
    # 12:27 Алматы (07:27 UTC)
    - cron: '27 7 * * *'
    # 15:42 Алматы (10:42 UTC)
    - cron: '42 10 * * *'
    # 18:55 Алматы (13:55 UTC)
    - cron: '55 13 * * *'
    # 21:33 Алматы (16:33 UTC)
    - cron: '33 16 * * *'
  workflow_dispatch: # Кнопка для ручного запуска

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: quiz-state
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install aiogram

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py

      - name: Commit updated state
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state change to commit."
          else
            git commit -m "chore: update quiz state"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME:-main}
            git push origin HEAD:${GITHUB_REF_NAME:-main}
          fi
